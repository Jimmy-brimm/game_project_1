<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>YouTube Player</title>
<style>
  :root { --bg:#0f0f0f; --fg:#f1f1f1; --muted:#aaa; --card:#272727; --red:#f00; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--fg); font-family:system-ui,sans-serif; }
  header { display:flex; align-items:center; gap:12px; padding:10px 16px; border-bottom:1px solid #303030; flex-wrap:wrap; }
  .logo { font-weight:700; font-size:20px; white-space:nowrap; }
  .logo span { background:var(--red); border-radius:6px; padding:2px 8px; margin-right:6px; }
  form { flex:1; display:flex; min-width:240px; max-width:720px; margin:0 auto; }
  input { flex:1; padding:10px 14px; background:#121212; color:var(--fg); border:1px solid #303030; border-radius:20px 0 0 20px; font-size:16px; }
  button, .btn { padding:10px 18px; background:var(--card); color:var(--fg); border:1px solid #303030; border-left:0; border-radius:0 20px 20px 0; cursor:pointer; font-size:16px; text-decoration:none; }
  .btn { border-left:1px solid #303030; border-radius:20px; }
  main { max-width:1100px; margin:20px auto; padding:0 16px; }
  .player { position:relative; aspect-ratio:16/9; background:#000; border-radius:12px; overflow:hidden; }
  .player iframe { position:absolute; inset:0; width:100%; height:100%; border:0; }
  .note { color:var(--muted); font-size:14px; margin:12px 0; }
  .samples { display:flex; gap:8px; flex-wrap:wrap; margin-top:12px; }
  .samples button { border-left:1px solid #303030; border-radius:16px; padding:6px 12px; font-size:14px; }
  #err { color:#ff8080; min-height:1.2em; }
</style>
</head>
<body>
<header>
  <div class="logo"><span>▶</span>YouTube Player</div>
  <form id="f">
    <input id="q" placeholder="Paste a YouTube video/playlist link or ID, or type a search" autocomplete="off">
    <button>Play</button>
  </form>
  <a class="btn" href="https://www.youtube.com" target="_blank" rel="noopener">Open youtube.com ↗</a>
</header>
<main>
  <div class="player"><iframe id="p" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; fullscreen" allowfullscreen referrerpolicy="strict-origin-when-cross-origin" title="YouTube player"></iframe></div>
  <p id="err"></p>
  <p class="note">youtube.com itself refuses to be embedded in other sites, so this page plays any video or playlist through YouTube's official embed player. Searches open in the player's search results.</p>
  <div class="samples" id="s"></div>
</main>
<script>
const base = "https://www.youtube-nocookie.com/embed/";
const p = document.getElementById("p"), q = document.getElementById("q"), err = document.getElementById("err");

function parse(input) {
  input = input.trim();
  if (!input) return null;
  if (/^[\w-]{11}$/.test(input)) return { video: input };
  try {
    const u = new URL(/^https?:\/\//.test(input) ? input : "https://" + input);
    const h = u.hostname.replace(/^www\.|^m\./, "");
    if (h === "youtu.be") return { video: u.pathname.slice(1), list: u.searchParams.get("list") };
    if (h.endsWith("youtube.com")) {
      const list = u.searchParams.get("list");
      let v = u.searchParams.get("v");
      const m = u.pathname.match(/^\/(?:shorts|embed|live)\/([\w-]{11})/);
      if (m) v = m[1];
      if (v || list) return { video: v, list };
    }
  } catch (e) {}
  return null;
}

function play(input) {
  err.textContent = "";
  const r = parse(input);
  if (r) {
    const params = new URLSearchParams({ autoplay: 1, rel: 0 });
    if (r.list) params.set(r.video ? "list" : "list", r.list);
    p.src = base + (r.video || "videoseries") + "?" + params;
  } else if (input.trim()) {
    p.src = base + "videoseries?" + new URLSearchParams({ listType: "search", list: input.trim() });
  }
}

document.getElementById("f").addEventListener("submit", e => { e.preventDefault(); play(q.value); });

const samples = { "Big Buck Bunny": "aqz-KE-bpKQ", "Lofi stream": "jfKfPfyJRdk", "Search: relaxing music": "relaxing music" };
for (const [label, val] of Object.entries(samples)) {
  const b = document.createElement("button");
  b.type = "button"; b.textContent = label;
  b.onclick = () => { q.value = val; play(val); };
  document.getElementById("s").append(b);
}
p.src = base + "jfKfPfyJRdk";
</script>
</body>
</html>
